name: Build Haymclub Signed Android Releases

on:
  workflow_dispatch:
  push:
    branches:
      - 'android-apk/**'

permissions:
  contents: read

jobs:
  build-release:

    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false

      matrix:
        include:

          - variant: superadmin
            name: Haymclub Super Admin
            android_dir: android-superadmin
            alias: haymclub-superadmin-upload
            keystore_secret: HAYMCLUB_SUPERADMIN_KEYSTORE_B64
            apk_name: Haymclub-SuperAdmin-Release.apk
            aab_name: Haymclub-SuperAdmin.aab
            artifact_name: Haymclub-SuperAdmin-Release

          - variant: academy
            name: Haymclub Academy
            android_dir: android-academy
            alias: haymclub-academy-upload
            keystore_secret: HAYMCLUB_ACADEMY_KEYSTORE_B64
            apk_name: Haymclub-Academy-Release.apk
            aab_name: Haymclub-Academy.aab
            artifact_name: Haymclub-Academy-Release

          - variant: trainee
            name: Haymclub Trainee
            android_dir: android-trainee
            alias: haymclub-trainee-upload
            keystore_secret: HAYMCLUB_TRAINEE_KEYSTORE_B64
            apk_name: Haymclub-Trainee-Release.apk
            aab_name: Haymclub-Trainee.aab
            artifact_name: Haymclub-Trainee-Release

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build mobile web app
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://haym.click/api
          VITE_HAYMCLUB_APP: ${{ matrix.variant }}
        run: npm run build

      - name: Sync Capacitor
        working-directory: frontend
        env:
          HAYMCLUB_APP: ${{ matrix.variant }}
        run: npx cap sync android

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets[matrix.keystore_secret] }}
          SIGNING_PASSWORD: ${{ secrets.HAYMCLUB_SIGNING_PASSWORD }}
          KEY_ALIAS: ${{ matrix.alias }}
        run: |
          set -e

          test -n "$KEYSTORE_B64"
          test -n "$SIGNING_PASSWORD"

          mkdir -p "$RUNNER_TEMP/haymclub-signing"

          KEYSTORE="$RUNNER_TEMP/haymclub-signing/${{ matrix.variant }}.p12"

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > "$KEYSTORE"

          chmod 600 "$KEYSTORE"

          keytool -list \
            -storetype PKCS12 \
            -keystore "$KEYSTORE" \
            -storepass:env SIGNING_PASSWORD \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "KEYSTORE VERIFIED"

      - name: Build unsigned Release APK
        working-directory: frontend/${{ matrix.android_dir }}
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon

      - name: Align and sign APK with v2 v3
        env:
          SIGNING_PASSWORD: ${{ secrets.HAYMCLUB_SIGNING_PASSWORD }}
        run: |
          set -e

          RELEASE="$RUNNER_TEMP/haymclub-release"
          KEYSTORE="$RUNNER_TEMP/haymclub-signing/${{ matrix.variant }}.p12"

          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          mkdir -p "$RELEASE"

          UNSIGNED_APK="$(
            find \
              "frontend/${{ matrix.android_dir }}/app/build/outputs/apk/release" \
              -type f \
              -name '*unsigned*.apk' \
              | head -1
          )"

          if [ -z "$UNSIGNED_APK" ]; then
            echo "UNSIGNED APK NOT FOUND"
            find \
              "frontend/${{ matrix.android_dir }}/app/build/outputs" \
              -type f \
              || true
            exit 2
          fi

          ALIGNED_APK="$RUNNER_TEMP/${{ matrix.variant }}-aligned.apk"
          FINAL_APK="$RELEASE/${{ matrix.apk_name }}"

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$UNSIGNED_APK" \
            "$ALIGNED_APK"

          "$ZIPALIGN" \
            -c \
            -v \
            4 \
            "$ALIGNED_APK"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias "${{ matrix.alias }}" \
            --ks-pass env:SIGNING_PASSWORD \
            --key-pass env:SIGNING_PASSWORD \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          echo
          echo "=== APK SIGNATURE VERIFY ==="

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$FINAL_APK"

          echo
          echo "✅ SIGNED APK VERIFIED"

          ls -lh "$FINAL_APK"

      - name: Build unsigned Release AAB
        working-directory: frontend/${{ matrix.android_dir }}
        run: |
          ./gradlew bundleRelease --no-daemon

      - name: Sign and verify AAB
        env:
          SIGNING_PASSWORD: ${{ secrets.HAYMCLUB_SIGNING_PASSWORD }}
        run: |
          set -e

          RELEASE="$RUNNER_TEMP/haymclub-release"
          KEYSTORE="$RUNNER_TEMP/haymclub-signing/${{ matrix.variant }}.p12"

          UNSIGNED_AAB="$(
            find \
              "frontend/${{ matrix.android_dir }}/app/build/outputs/bundle/release" \
              -type f \
              -name '*.aab' \
              | head -1
          )"

          if [ -z "$UNSIGNED_AAB" ]; then
            echo "AAB NOT FOUND"
            find \
              "frontend/${{ matrix.android_dir }}/app/build/outputs" \
              -type f \
              || true
            exit 2
          fi

          FINAL_AAB="$RELEASE/${{ matrix.aab_name }}"

          jarsigner \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass:env SIGNING_PASSWORD \
            -keypass:env SIGNING_PASSWORD \
            -signedjar "$FINAL_AAB" \
            "$UNSIGNED_AAB" \
            "${{ matrix.alias }}"

          echo
          echo "=== AAB SIGNATURE VERIFY ==="

          jarsigner \
            -verify \
            "$FINAL_AAB"

          echo
          echo "✅ SIGNED AAB VERIFIED"

          ls -lh "$FINAL_AAB"

      - name: Upload signed release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ runner.temp }}/haymclub-release/${{ matrix.apk_name }}
            ${{ runner.temp }}/haymclub-release/${{ matrix.aab_name }}
          if-no-files-found: error
          retention-days: 30
